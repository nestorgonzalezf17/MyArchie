# MyArchie · Starship — Catppuccin Mocha
# Documentación: https://starship.rs/config/

format = """
[](surface0)\
$os\
$username\
[](bg:peach fg:surface0)\
$directory\
[](fg:peach bg:green)\
$git_branch\
$git_status\
[](fg:green bg:sapphire)\
$c\
$dotnet\
$golang\
$java\
$nodejs\
$php\
$python\
$rust\
[](fg:sapphire bg:lavender)\
$docker_context\
$conda\
[](fg:lavender bg:surface0)\
$time\
[ ](fg:surface0)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
overlay0  = "#6c7086"
surface0  = "#313244"
base      = "#1e1e2e"
crust     = "#11111b"

[os]
disabled = false
style = "bg:surface0 fg:text"
format = '[ $symbol]($style)'

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:red"
format = '[ $user ]($style)'

[directory]
style = "fg:crust bg:peach"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documentos" = "󰈙 "
"Descargas"  = " "
"Música"     = " "
"Imágenes"   = " "
"dev"        = "󰲋 "

[git_branch]
symbol = ""
style = "bg:green"
format = '[[ $symbol $branch ](fg:crust bg:green)]($style)'

[git_status]
style = "bg:green"
format = '[[($all_status$ahead_behind )](fg:crust bg:green)]($style)'

[dotnet]
symbol = "󰪮 "
style = "bg:sapphire"
format = '[[ $symbol($version) ](fg:crust bg:sapphire)]($style)'

[nodejs]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol($version) ](fg:crust bg:sapphire)]($style)'

[python]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol($version)(\($virtualenv\)) ](fg:crust bg:sapphire)]($style)'

[java]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol($version) ](fg:crust bg:sapphire)]($style)'

[php]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol($version) ](fg:crust bg:sapphire)]($style)'

[rust]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol($version) ](fg:crust bg:sapphire)]($style)'

[golang]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol($version) ](fg:crust bg:sapphire)]($style)'

[c]
symbol = " "
style = "bg:sapphire"
format = '[[ $symbol($version) ](fg:crust bg:sapphire)]($style)'

[docker_context]
symbol = ""
style = "bg:lavender"
format = '[[ $symbol( $context) ](fg:crust bg:lavender)]($style)'

[conda]
style = "bg:lavender"
format = '[[ $symbol( $environment) ](fg:crust bg:lavender)]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "bg:surface0"
format = '[[ 󰅐 $time ](fg:text bg:surface0)]($style)'

[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = ' [󱎫 $duration]($style)'

[character]
success_symbol = '[❯](bold green)'
error_symbol   = '[❯](bold red)'
vimcmd_symbol  = '[❮](bold mauve)'

[line_break]
disabled = false
