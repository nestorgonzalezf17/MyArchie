# ══════════════════════════════════════════════════════════════════
#  MyArchie · Hyprland
#  Documentación: https://wiki.hyprland.org
#  Recarga: se aplica sola al guardar (o Super+Shift+R)
# ══════════════════════════════════════════════════════════════════

# ───────────────────────────── MONITORES ──────────────────────────
# Ver los tuyos con: hyprctl monitors
# Formato: nombre, resolución@refresco, posición, escala
monitor = , preferred, auto, 1
# Ejemplos:
# monitor = eDP-1,  1920x1080@60,  0x0,    1
# monitor = HDMI-A-1, 2560x1440@144, 1920x0, 1
# monitor = eDP-1,  3840x2160@60,  0x0,    1.5   # HiDPI

# ───────────────────────────── ENTORNO ────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = GDK_BACKEND,wayland,x11
env = XCURSOR_THEME,catppuccin-mocha-blue-cursors
env = XCURSOR_SIZE,24
env = DOTNET_CLI_TELEMETRY_OPTOUT,1
env = DOTNET_NOLOGO,1

# NVIDIA: descomenta si tienes GPU NVIDIA
# env = LIBVA_DRIVER_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# cursor { no_hardware_cursors = true }

# ───────────────────────────── AUTOARRANQUE ───────────────────────
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor catppuccin-mocha-blue-cursors 24

# ───────────────────────────── APARIENCIA ─────────────────────────
general {
    gaps_in  = 5
    gaps_out = 12
    border_size = 2
    col.active_border   = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(313244aa)
    resize_on_border = true
    allow_tearing = false          # ponlo en true solo para juegos competitivos
    layout = dwindle
}

decoration {
    rounding = 12

    active_opacity   = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = true
        noise = 0.012
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(0f0f18aa)
    }
}

animations {
    enabled = true

    bezier = suave,  0.05, 0.9, 0.1, 1.0
    bezier = rapido, 0.16, 1.0, 0.3, 1.0
    bezier = rebote, 0.68, -0.55, 0.265, 1.55

    animation = windows,     1, 5, rapido, popin 85%
    animation = windowsOut,  1, 4, suave,  popin 85%
    animation = border,      1, 8, suave
    animation = fade,        1, 5, suave
    animation = workspaces,  1, 5, rapido, slidevert
    animation = specialWorkspace, 1, 5, rebote, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true                     # ahorra batería: no redibuja si nada cambia
    focus_on_activate = true
    animate_manual_resizes = false
}

# ───────────────────────────── ENTRADA ────────────────────────────
input {
    kb_layout  = latam            # cámbialo a "es" o "us" según tu teclado
    kb_options = compose:ralt
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        scroll_factor = 0.6
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

xwayland {
    force_zero_scaling = true      # evita que las apps X11 se vean borrosas
}

# ───────────────────────────── ATAJOS ─────────────────────────────
$mod      = SUPER
$terminal = kitty
$menu     = wofi --show drun
$explorer = thunar
$navegador = firefox

# Aplicaciones
bind = $mod, Return, exec, $terminal
bind = $mod, D,      exec, $menu
bind = $mod, E,      exec, $explorer
bind = $mod, B,      exec, $navegador
bind = $mod, C,      exec, kitty --class claude-float -e claude

# Ventanas
bind = $mod, Q, killactive,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod SHIFT, M, exit,

# Foco
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Mover ventanas
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Redimensionar
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive,  40 0
binde = $mod CTRL, up,    resizeactive, 0 -40
binde = $mod CTRL, down,  resizeactive, 0  40

# Con el ratón
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Espacios de trabajo
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Scratchpad
bind = $mod, S,        togglespecialworkspace, magia
bind = $mod SHIFT, S,  movetoworkspace, special:magia

# Capturas
bind = , Print,       exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print,  exec, grim ~/Imágenes/captura-$(date +%F_%H%M%S).png
bind = $mod, Print,   exec, grim -g "$(slurp)" ~/Imágenes/captura-$(date +%F_%H%M%S).png

# Portapapeles
bind = $mod SHIFT, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Sistema
bind = $mod, L,       exec, hyprlock
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, E, exec, wlogout || hyprctl dispatch exit

# Multimedia
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

# ───────────────────────────── REGLAS ─────────────────────────────
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Claude Code flotante y centrado
windowrulev2 = float,       class:^(claude-float)$
windowrulev2 = size 1200 800, class:^(claude-float)$
windowrulev2 = center,      class:^(claude-float)$

# Diálogos siempre flotantes
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, title:^(Open File|Save File|Abrir archivo|Guardar archivo)$

# Reglas de espacio: cada cosa en su sitio
windowrulev2 = workspace 1, class:^(firefox|zen|chromium)$
windowrulev2 = workspace 2, class:^(code|Code|jetbrains-.*)$
windowrulev2 = workspace 4, class:^(dbeaver|azuredatastudio)$
windowrulev2 = workspace 5 silent, class:^(discord|Slack|thunderbird)$

# Sin opacidad en apps donde molesta
windowrulev2 = opacity 1.0 override, class:^(firefox|chromium|code|Code)$

# Picture-in-picture siempre visible
windowrulev2 = float,  title:^(Picture-in-Picture)$
windowrulev2 = pin,    title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-500 100%-290, title:^(Picture-in-Picture)$
